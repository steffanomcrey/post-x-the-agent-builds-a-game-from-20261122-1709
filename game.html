<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snake — built from one prompt</title>
<style>
  body { margin: 0; background: #0b0b12; color: #f5f5f8; font-family: sans-serif;
         display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 24px 0 4px; font-size: 28px; }
  #hud { font-family: monospace; font-size: 20px; margin: 8px 0 16px; color: #facc15; }
  canvas { background: #0d1b11; border: 3px solid #345a3c; border-radius: 12px; }
  p { color: #a0a0b2; }
</style>
</head>
<body>
<h1>SNAKE</h1>
<div id="hud">SCORE 0 &nbsp; SPEED x1.0</div>
<canvas id="game" width="784" height="420"></canvas>
<p>Arrow keys or WASD to steer. Eat the red food, grow, get faster.</p>
<script>
  // Tiny snake game, built from one prompt:
  // "a snake that eats, grows, and gets faster. Make it fun."
  const COLS = 28, ROWS = 15, CELL = 28;
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const hud = document.getElementById('hud');
  let snake = [{x: 6, y: 7}, {x: 5, y: 7}, {x: 4, y: 7}];
  let dir = {x: 1, y: 0}, pending = dir;
  let food = spawnFood(), score = 0, over = false;
  function spawnFood() {
    let f;
    do { f = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)}; }
    while (snake.some(s => s.x === f.x && s.y === f.y));
    return f;
  }
  addEventListener('keydown', e => {
    const k = {ArrowUp: [0,-1], KeyW: [0,-1], ArrowDown: [0,1], KeyS: [0,1],
               ArrowLeft: [-1,0], KeyA: [-1,0], ArrowRight: [1,0], KeyD: [1,0]}[e.code];
    if (k && !(k[0] === -dir.x && k[1] === -dir.y)) pending = {x: k[0], y: k[1]};
  });
  function step() {
    if (over) return;
    dir = pending;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      over = true; hud.textContent = 'GAME OVER — SCORE ' + score + ' (refresh to play again)';
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) { score++; food = spawnFood(); }
    else snake.pop();
    const speed = 1 + score * 0.12;
    hud.textContent = 'SCORE ' + score + '   SPEED x' + speed.toFixed(1);
    draw();
    setTimeout(step, 220 / speed);
  }
  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x * CELL + 14, food.y * CELL + 14, 10, 0, 7);
    ctx.fill();
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#22c55e' : '#15803d';
      ctx.beginPath();
      ctx.roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 8);
      ctx.fill();
    });
  }
  draw();
  setTimeout(step, 220);
</script>
</body>
</html>
